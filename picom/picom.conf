# Use GLX backend for full animations
backend = "glx";

# Opacity settings for focused and unfocused windows
active-opacity = 1.0;
inactive-opacity = 0.93;

# Enable shadows but keep them simple
shadow = false;
shadow-radius = 10;
shadow-opacity = 1.0;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-color = "#000000";

# Enable blur (GLX supports this)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 0;

# Enable fading for smooth opacity transitions
fading = false;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 10;

# Enable animations
animations = false;
animation-stiffness = 200;
animation-dampening = 20;
animation-clamping = true;

# Animation types (examples, tweak to taste)
animation-for-open-window = "zoom";
animation-for-unmap-window = "slide-down";
animation-for-transient-window = "slide-up";
animation-for-menu-window = "zoom";

# Use damage tracking for better performance
use-damage = true;

# Detect focused window using EWMH (helps with opacity detection)
detect-rounded-corners = true;
detect-client-opacity = true;

# Basic rules to disable shadow on docks and desktop windows
rules: ({
  match = "window_type = 'dock' || window_type = 'desktop'";
  shadow = false;
});

# VSync to reduce tearing
vsync = true;

unredir-if-possible = true;

opacity-rule = [
  "70:class_g = 'Polybar'"
];
