
# vim: ft=cfg

#-------------------------------------------
# Terminals
#-------------------------------------------
mime ^ranger/x-terminal-emulator, has kitty      = kitty --detach
mime ^ranger/x-terminal-emulator, has alacritty  = alacritty -e
mime ^ranger/x-terminal-emulator, has urxvt      = urxvt -e
mime ^ranger/x-terminal-emulator, has xterm      = xterm -e
mime ^ranger/x-terminal-emulator, has st         = st -e

#-------------------------------------------
# Scripts
#-------------------------------------------
ext sh,  = sh --
ext py,  has python3 = python3 --
ext py,  has python  = python --
ext pl,  has perl    = perl --
ext rb,  has ruby    = ruby --
ext php, has php     = php --
ext js,  has node    = node --

#-------------------------------------------
# PDFs
#-------------------------------------------
mime ^application/pdf, has zathura, X, flag f  = zathura -- "$@"
mime ^application/pdf, has mupdf,   X, flag f  = mupdf "$@"
mime ^application/pdf, has okular,  X, flag f  = okular -- "$@"
mime ^application/pdf, has evince,  X, flag f  = evince -- "$@"

#-------------------------------------------
# Images
#-------------------------------------------
mime ^image/svg, has inkscape, X, flag f = inkscape -- "$@"
mime ^image/svg, has display,  X, flag f = display -- "$@"

mime ^image, has eog, X, flag f   = eog -- "$@"
ext xcf,              X, flag f   = gimp -- "$@"

#-------------------------------------------
# Videos
#-------------------------------------------
mime ^video, has mpv,      X, flag f = mpv -- "$@"
mime ^video, has vlc,      X, flag f = vlc -- "$@"
mime ^video, has smplayer, X, flag f = smplayer "$@"

#-------------------------------------------
# Audio
#-------------------------------------------
mime ^audio, has mpv, flag f       = mpv -- "$@"
mime ^audio, has vlc, flag f       = vlc -- "$@"
mime ^audio, has mplayer, flag f   = mplayer "$@"
mime ^audio, has cmus-remote, flag f = cmus-remote -- "$@"

#-------------------------------------------
# Archives
#-------------------------------------------
ext tar.gz|tgz,  has tar = tar xzvf --
ext tar.bz2|tbz, has tar = tar xjvf --
ext tar.xz|txz,  has tar = tar xJvf --
ext zip,         has unzip = unzip --
ext rar,         has unrar = unrar x --
ext 7z,          has 7z    = 7z x --

#-------------------------------------------
# Text
#-------------------------------------------
mime ^text,  terminal          = $EDITOR -- "$@"
mime ^text, !terminal, has gvim, X = gvim -- "$@"
mime ^text, !terminal, has xed,  X = xed -- "$@"

#-------------------------------------------
# Miscellaneous
#-------------------------------------------
ext html?, has firefox,  X = firefox -- "$@"
ext html?, has chromium, X = chromium -- "$@"
ext html?, has xdg-open, X = xdg-open -- "$@"

ext docx?, has libreoffice, X = libreoffice -- "$@"
ext pptx?, has libreoffice, X = libreoffice -- "$@"
ext xlsx?, has libreoffice, X = libreoffice -- "$@"

ext torrent, has transmission-gtk, X = transmission-gtk "$@"
ext torrent, has deluge-gtk,       X = deluge-gtk "$@"

#-------------------------------------------
# Wallpapers
#-------------------------------------------
label wallpaper, number 11, mime ^image, has eog, X = eog "$1"
label wallpaper, number 12, mime ^image, has eog, X = eog "$1"
label wallpaper, number 13, mime ^image, has eog, X = eog "$1"
label wallpaper, number 14, mime ^image, has eog, X = eog "$1"

#-------------------------------------------
# Fallback
#-------------------------------------------
mime ^all, has xdg-open, X = xdg-open -- "$@"
mime ^all, has open,     X = open -- "$@"
