[colors.primary]
background = "#100706"
foreground = "#f3d8aa"

[colors.cursor]
cursor = "#f3d8aa"
text = "CellBackground"

[colors.normal]
black   = "#100706" # color0
red     = "#D25E2C" # color1
green   = "#F9752F" # color2
yellow  = "#AF5F45" # color3
blue    = "#FD8A35" # color4
magenta = "#F19D38" # color5
cyan    = "#f3d8aa" # color6
white   = "#f3d8aa" # color7

[colors.bright]
black   = "#100706" # color8
red     = "#F19D38" # color9
green   = "#FD8A35" # color10
yellow  = "#AF5F45" # color11
blue    = "#F9752F" # color12
magenta = "#D25E2C" # color13
cyan    = "#aa9776" # color14
white   = "#f3d8aa" # color15

[cursor]
blink_interval = 270
unfocused_hollow = true

[cursor.style]
blinking = "On"
shape = "Underline"

[font]
size = 6.0

[font.bold]
family = "Jetbrains Mono Nerd Font"

[font.bold_italic]
family = "Jetbrains Mono Nerd Font"

[font.italic]
family = "Jetbrains Mono Nerd Font"

[font.normal]
family = "Jetbrains Mono Nerd Font"

[mouse]
hide_when_typing = true

[window]
blur = true
decorations = "full"
dynamic_padding = false
opacity = 0.7
startup_mode = "Windowed"

[window.padding]
x = 13
y = 13

[general]
live_config_reload = true
ipc_socket = true
